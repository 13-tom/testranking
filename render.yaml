services:
  - type: web
    name: board-ranking-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w packages/shared && npm run prisma:generate -w apps/api && npm run build -w apps/api && npm run prisma:migrate:deploy -w apps/api && npm run prisma:seed -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
